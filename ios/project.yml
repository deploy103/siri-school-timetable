name: SchoolToday
options:
  bundleIdPrefix: com.deploy103
  developmentLanguage: ko
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    SCHOOL_API_BASE_URL: "https://time.mvtp.cloud"
    GENERATE_INFOPLIST_FILE: NO
targets:
  SchoolToday:
    type: application
    platform: iOS
    sources: [SchoolToday]
    dependencies:
      - target: SchoolTodayWidget
        embed: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.deploy103.schooltoday
        INFOPLIST_FILE: SchoolToday/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: SchoolToday.entitlements
      configs:
        Debug:
          ICLOUD_CONTAINER_ENVIRONMENT: Development
        Release:
          ICLOUD_CONTAINER_ENVIRONMENT: Production
  SchoolTodayWidget:
    type: app-extension
    platform: iOS
    sources:
      - SchoolTodayWidget
      - SchoolToday/Models.swift
      - SchoolToday/PlannerModels.swift
      - SchoolToday/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deploy103.schooltoday.widget
        INFOPLIST_FILE: SchoolTodayWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: SchoolTodayWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  SchoolTodayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SchoolTodayTests
        excludes:
          - PlusStoreKitTests.swift
          - Plus.storekit
    dependencies:
      - target: SchoolToday
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  StoreKitTestHost:
    type: application
    platform: iOS
    sources:
      - path: StoreKitTestHost/StoreKitTestHost.swift
      - path: SchoolToday/PlusStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deploy103.schooltoday.storekittesthost
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
  SchoolTodayStoreKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SchoolTodayTests/PlusStoreKitTests.swift
      - path: SchoolTodayTests/Plus.storekit
        buildPhase: resources
    dependencies:
      - target: StoreKitTestHost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SchoolTodayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SchoolTodayUITests]
    dependencies:
      - target: SchoolToday
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SchoolToday:
    build:
      targets:
        SchoolToday: all
    test:
      targets:
        - SchoolTodayTests
        - SchoolTodayUITests
  SchoolToday-LocalStoreKit:
    build:
      targets:
        StoreKitTestHost: [run, test]
    run:
      storeKitConfiguration: SchoolTodayTests/Plus.storekit
    test:
      targets:
        - name: SchoolTodayStoreKitTests
          parallelizable: false
