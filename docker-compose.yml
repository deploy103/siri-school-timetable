services:
  siri-school-timetable:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    expose:
      - "3000"
    environment:
      NODE_ENV: production
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - mvtp-web-net

networks:
  mvtp-web-net:
    external: true
