<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" role="img" aria-labelledby="t3 d3">
  <title id="t3">URL 콘텐츠 가져오기, 텍스트 말하기 동작 추가</title>
  <desc id="d3">단축어에 URL 콘텐츠 가져오기 동작과 텍스트 말하기 동작을 순서대로 쌓아 추가하는 모습을 나타낸 자체 제작 안내 그림</desc>
  <rect width="320" height="420" fill="#f4f7fc" rx="20"/>
  <rect x="60" y="24" width="200" height="372" rx="34" fill="#ffffff" stroke="#dfe5f1" stroke-width="3"/>
  <rect x="130" y="38" width="60" height="10" rx="5" fill="#dfe5f1"/>
  <g font-family="sans-serif">
    <rect x="86" y="80" width="172" height="44" rx="10" fill="#fff" stroke="#3157d5" stroke-width="2"/>
    <text x="172" y="107" font-size="12" fill="#3157d5" text-anchor="middle" font-weight="700">1. URL</text>
    <path d="M172 124 v20" stroke="#c5cfe0" stroke-width="3"/>
    <rect x="86" y="150" width="172" height="54" rx="10" fill="#fff" stroke="#3157d5" stroke-width="2"/>
    <text x="172" y="172" font-size="12" fill="#3157d5" text-anchor="middle" font-weight="700">2. URL 콘텐츠 가져오기</text>
    <text x="172" y="190" font-size="10" fill="#78849a" text-anchor="middle">메서드: GET (기본값)</text>
    <path d="M172 204 v20" stroke="#c5cfe0" stroke-width="3"/>
    <rect x="86" y="230" width="172" height="54" rx="10" fill="#fff" stroke="#7657d6" stroke-width="2"/>
    <text x="172" y="252" font-size="12" fill="#7657d6" text-anchor="middle" font-weight="700">3. 텍스트 말하기</text>
    <text x="172" y="270" font-size="10" fill="#78849a" text-anchor="middle">입력: 앞 동작의 URL 콘텐츠</text>
    <circle cx="248" cy="257" r="12" fill="#eafff2"/>
    <path d="M242 257 l4 4 8-8" stroke="#1a9a5c" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="86" y="330" width="172" height="46" rx="12" fill="#eef1fb"/>
    <text x="172" y="352" font-size="12" fill="#65718b" text-anchor="middle">이 순서 그대로 2개를 추가하세요</text>
    <text x="172" y="368" font-size="11" fill="#65718b" text-anchor="middle">옵션은 기본값 그대로 OK</text>
  </g>
</svg>
