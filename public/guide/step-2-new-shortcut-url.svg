<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" role="img" aria-labelledby="t2 d2">
  <title id="t2">새 단축어 만들고 주소 붙여넣기</title>
  <desc id="d2">단축어 앱에서 더하기 버튼을 눌러 새 단축어를 만들고 복사한 주소를 URL 동작에 붙여넣는 모습을 나타낸 자체 제작 안내 그림</desc>
  <rect width="320" height="420" fill="#f4f7fc" rx="20"/>
  <rect x="60" y="24" width="200" height="372" rx="34" fill="#ffffff" stroke="#dfe5f1" stroke-width="3"/>
  <rect x="130" y="38" width="60" height="10" rx="5" fill="#dfe5f1"/>
  <g font-family="sans-serif">
    <text x="86" y="78" font-size="14" fill="#172033" font-weight="700">내 단축어</text>
    <circle cx="234" cy="72" r="16" fill="#3157d5"/>
    <text x="234" y="78" font-size="18" fill="#fff" text-anchor="middle">+</text>
    <circle cx="234" cy="72" r="24" fill="none" stroke="#7657d6" stroke-width="3" stroke-dasharray="5 4"/>
    <rect x="86" y="112" width="172" height="46" rx="12" fill="#eef1fb"/>
    <text x="172" y="140" font-size="13" fill="#65718b" text-anchor="middle">URL 동작 추가</text>
    <rect x="86" y="172" width="172" height="44" rx="10" fill="#fff" stroke="#3157d5" stroke-width="2"/>
    <text x="172" y="199" font-size="11" fill="#3157d5" text-anchor="middle" font-family="ui-monospace, monospace">https://.../voice/timetable?...</text>
    <path d="M172 226 v22" stroke="#7657d6" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#arrow2)"/>
    <defs>
      <marker id="arrow2" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
        <path d="M0 0 L10 5 L0 10 Z" fill="#7657d6"/>
      </marker>
    </defs>
    <rect x="86" y="256" width="172" height="60" rx="12" fill="#f8f3ff" stroke="#7657d6" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="172" y="280" font-size="12" fill="#5f526c" text-anchor="middle" font-weight="700">사이트에서 복사한 주소</text>
    <text x="172" y="300" font-size="11" fill="#5f526c" text-anchor="middle">붙여넣기</text>
    <rect x="86" y="330" width="172" height="46" rx="12" fill="#eef1fb"/>
    <text x="172" y="358" font-size="13" fill="#65718b" text-anchor="middle">주소를 그대로 붙여넣으세요</text>
  </g>
</svg>
