name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7

  ios:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Record native diagnostic toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Install verified XcodeGen 2.46.0
        run: |
          curl -fsSL --retry 3 https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-tool"
          echo "$RUNNER_TEMP/xcodegen-tool/xcodegen/bin" >> "$GITHUB_PATH"
      - run: xcodegen generate --spec ios/project.yml --project ios
      - name: Unsigned iPhone Release build
        run: |
          xcodebuild -project ios/SchoolToday.xcodeproj -scheme SchoolToday \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-device" CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-shortcut-metadata
          path: |
            ${{ runner.temp }}/ios-device/Build/Products/Release-iphoneos/SchoolToday.app/Metadata.appintents
            ${{ runner.temp }}/ios-device/Build/Products/Release-iphoneos/SchoolToday.app/ko.lproj/nlu.appintents
            ${{ runner.temp }}/ios-device/Build/Intermediates.noindex/SchoolToday.build/Release-iphoneos/SchoolToday.build/SchoolToday.DependencyMetadataFileList
          retention-days: 7
      - name: Real-time external yearly delivery control
        timeout-minutes: 20
        run: |
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json, sys; print(next(device["udid"] for devices in json.load(sys.stdin)["devices"].values() for device in devices if device["name"].startswith("iPhone")))')
          xcodebuild -project ios/SchoolToday.xcodeproj -scheme SchoolToday-LocalStoreKit \
            -configuration Debug -destination "platform=iOS Simulator,id=$device_id" \
            -destination-timeout 120 -derivedDataPath "$RUNNER_TEMP/ios-build" \
            -parallel-testing-enabled NO \
            -only-testing:SchoolTodayStoreKitTests/PlusStoreKitTests/testExternalYearlyDeliveryInRealTime \
            -resultBundlePath "$RUNNER_TEMP/YearlyDelivery.xcresult" CODE_SIGNING_ALLOWED=NO test
      - name: Local StoreKit subscription lifecycle
        timeout-minutes: 20
        run: |
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json, sys; print(next(device["udid"] for devices in json.load(sys.stdin)["devices"].values() for device in devices if device["name"].startswith("iPhone")))')
          xcodebuild -project ios/SchoolToday.xcodeproj -scheme SchoolToday-LocalStoreKit \
            -configuration Debug -destination "platform=iOS Simulator,id=$device_id" \
            -destination-timeout 120 -derivedDataPath "$RUNNER_TEMP/ios-build" \
            -parallel-testing-enabled NO \
            -only-testing:SchoolTodayStoreKitTests/PlusStoreKitTests/testLocalSubscriptionLifecycle \
            -resultBundlePath "$RUNNER_TEMP/PlusStoreKit.xcresult" CODE_SIGNING_ALLOWED=NO test
      - name: Native unit and UI tests
        run: |
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json, sys; print(next(device["udid"] for devices in json.load(sys.stdin)["devices"].values() for device in devices if device["name"].startswith("iPhone")))')
          xcodebuild -project ios/SchoolToday.xcodeproj -scheme SchoolToday \
            -configuration Debug -destination "platform=iOS Simulator,id=$device_id" \
            -destination-timeout 120 -derivedDataPath "$RUNNER_TEMP/ios-build" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/SchoolToday.xcresult" CODE_SIGNING_ALLOWED=NO test
      - name: Export native screenshots
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/SchoolToday.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/SchoolToday.xcresult" --output-path "$RUNNER_TEMP/native-screenshots"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-screenshots
          path: ${{ runner.temp }}/native-screenshots
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-results
          path: |
            ${{ runner.temp }}/SchoolToday.xcresult
            ${{ runner.temp }}/PlusStoreKit.xcresult
            ${{ runner.temp }}/YearlyDelivery.xcresult
          retention-days: 7
