<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" role="img" aria-labelledby="t4 d4">
  <title id="t4">단축어 이름을 Siri 문구로 저장</title>
  <desc id="d4">단축어 설정 화면에서 이름 입력란에 시리에게 말할 문구를 그대로 적어 저장하는 모습을 나타낸 자체 제작 안내 그림</desc>
  <rect width="320" height="420" fill="#f4f7fc" rx="20"/>
  <rect x="60" y="24" width="200" height="372" rx="34" fill="#ffffff" stroke="#dfe5f1" stroke-width="3"/>
  <rect x="130" y="38" width="60" height="10" rx="5" fill="#dfe5f1"/>
  <g font-family="sans-serif">
    <circle cx="234" cy="72" r="14" fill="#eef1fb"/>
    <circle cx="234" cy="72" r="6" fill="#3157d5"/>
    <path d="M234 62v-4M234 82v4M244 72h4M220 72h4" stroke="#3157d5" stroke-width="2" stroke-linecap="round"/>
    <text x="86" y="78" font-size="14" fill="#172033" font-weight="700">단축어 이름</text>
    <rect x="86" y="112" width="172" height="54" rx="12" fill="#fff" stroke="#7657d6" stroke-width="2.5"/>
    <text x="172" y="135" font-size="13" fill="#172033" text-anchor="middle" font-weight="700">오늘 학교</text>
    <text x="172" y="153" font-size="13" fill="#172033" text-anchor="middle" font-weight="700">시간표 뭐야</text>
    <circle cx="248" cy="120" r="12" fill="#eafff2"/>
    <path d="M242 120 l4 4 8-8" stroke="#1a9a5c" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M172 176 v20" stroke="#c5cfe0" stroke-width="3"/>
    <rect x="86" y="202" width="172" height="54" rx="12" fill="#fff" stroke="#3157d5" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="172" y="225" font-size="13" fill="#3157d5" text-anchor="middle" font-weight="700">오늘 학교</text>
    <text x="172" y="243" font-size="13" fill="#3157d5" text-anchor="middle" font-weight="700">급식 뭐야</text>
    <text x="172" y="290" font-size="10" fill="#78849a" text-anchor="middle">(급식 단축어는 이 이름을 추천)</text>
    <rect x="86" y="330" width="172" height="46" rx="12" fill="#eef1fb"/>
    <text x="172" y="358" font-size="12" fill="#65718b" text-anchor="middle">부를 문구를 이름칸에 그대로 저장</text>
  </g>
</svg>
